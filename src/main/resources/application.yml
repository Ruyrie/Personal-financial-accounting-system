# 应用配置文件：配置数据源、SQL 初始化、Thymeleaf 缓存、服务端口和默认安全参数。
spring:
  application:
    name: personal-finance-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:123456}
