<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分类管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">¥</span>
        <span class="brand-copy">
            <strong>个人理财记账系统</strong>
        </span>
    </a>
    <nav class="primary-nav" aria-label="主导航">
        <a th:href="@{/}">总览</a>
        <a th:href="@{/transactions}">收支记录</a>
        <a th:href="@{/transactions/new}">记一笔</a>
        <a th:href="@{/categories}" class="active">分类管理</a>
        <div class="profile-menu" data-profile-menu>
            <button class="avatar-trigger" type="button" data-profile-trigger aria-label="个人中心">
                <img th:if="${currentUser != null && currentUser.avatarData != null}" th:src="${currentUser.avatarData}" alt="头像">
                <img th:if="${currentUser == null || currentUser.avatarData == null}" th:src="@{/images/morentouxiang.png}" alt="默认头像">
            </button>
            <div class="profile-panel" data-profile-panel>
                <div class="profile-id">
                    <span class="profile-id-avatar">
                        <img th:if="${currentUser != null && currentUser.avatarData != null}" th:src="${currentUser.avatarData}" alt="头像">
                        <img th:if="${currentUser == null || currentUser.avatarData == null}" th:src="@{/images/morentouxiang.png}" alt="默认头像">
                    </span>
                    <div class="profile-id-meta">
                        <strong th:text="${currentUser != null ? currentUser.username : '个人中心'}"
                                th:title="${currentUser != null ? currentUser.username : '个人中心'}">个人中心</strong>
                    </div>
                </div>
                <form class="profile-action-form" th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                    <label class="profile-action profile-upload">
                        <span class="profile-action-icon" aria-hidden="true">⟳</span>
                        <span class="profile-action-text">更换头像</span>
                        <input name="avatar" type="file" accept="image/png,image/jpeg,image/webp" onchange="this.form.submit()">
                    </label>
                </form>
                <button class="profile-action" type="button" data-open-password-modal>
                    <span class="profile-action-icon" aria-hidden="true">✎</span>
                    <span class="profile-action-text">修改密码</span>
                </button>
                <a class="profile-action" th:href="@{/transactions/export}" th:data-export-base="@{/transactions/export}" data-export-trigger>
                    <span class="profile-action-icon" aria-hidden="true">↧</span>
                    <span class="profile-action-text">导出excel数据</span>
                </a>
                <form class="profile-action-form" th:action="@{/logout}" method="post">
                    <button class="profile-action profile-action-danger" type="submit">
                        <span class="profile-action-icon" aria-hidden="true">⏻</span>
                        <span class="profile-action-text">退出登录</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main class="container category-page">
    <section class="page-head compact-head">
        <div>
            <h1>分类管理</h1>
            <p>维护收入分类和支出分类</p>
        </div>
        <button class="button category-create-button" type="button" data-open-category-modal>新建分类</button>
    </section>

    <div class="toast" th:if="${message}" th:text="${message}">已保存</div>
    <div class="toast error" th:if="${error}" th:text="${error}">操作失败</div>

    <section class="category-list-panel" aria-label="分类列表">
        <div class="category-toolbar">
            <div>
                <h2 data-category-title>收入分类</h2>
                <p data-category-count>共 0 个收入分类</p>
            </div>
            <div class="category-tabs" aria-label="分类类型筛选">
                <button class="is-active" type="button" data-category-filter="1">收入</button>
                <button type="button" data-category-filter="2">支出</button>
            </div>
        </div>

        <div class="empty" data-category-empty hidden>暂无收入分类，点击“新建分类”开始添加。</div>

        <article class="category-row" th:each="item : ${categories}" th:data-category-type="${item.type}">
            <div class="category-summary">
                <span class="category-icon" th:text="${item.type == 1 ? '+' : '-'}">+</span>
                <div>
                    <strong th:text="${item.name}">分类</strong>
                    <p>
                        <span th:text="${item.type == 1 ? '收入' : '支出'}">支出</span>
                        <span th:text="${'排序 ' + item.sortOrder}">排序 0</span>
                    </p>
                </div>
            </div>
            <div class="category-meta">
                <span class="pill" th:classappend="${item.type == 1 ? ' income-pill' : ' expense-pill'}"
                      th:text="${item.type == 1 ? '收入' : '支出'}">收入</span>
                <span class="code-chip" th:text="${item.icon ?: 'tag'}">tag</span>
                <span class="sort-chip" th:text="${item.sortOrder}">0</span>
            </div>
            <div class="category-actions">
                <button class="secondary" type="button"
                        data-edit-category
                        th:data-id="${item.id}"
                        th:data-name="${item.name}"
                        th:data-type="${item.type}"
                        th:data-icon="${item.icon}"
                        th:data-sort="${item.sortOrder}">
                    编辑
                </button>
                <form th:action="@{/categories/{id}/delete(id=${item.id})}" method="post" data-delete-category>
                    <button class="link-danger" type="submit"
                            th:data-category-name="${item.name}"
                            th:data-category-kind="${item.type == 1 ? '收入' : '支出'}">删除</button>
                </form>
            </div>
        </article>
    </section>

    <div class="modal-backdrop" data-category-modal hidden>
        <section class="category-modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
            <div class="modal-head">
                <div>
                    <h2 id="category-modal-title">新建分类</h2>
                    <p>设置分类名称、类型、图标标识和排序。</p>
                </div>
                <button class="icon-button" type="button" aria-label="关闭" data-close-category-modal>×</button>
            </div>
            <form class="modal-form" th:action="@{/categories}" method="post" data-category-form>
                <input name="id" type="hidden" data-category-id>
                <label>
                    名称
                    <input name="name" maxlength="50" required data-category-name>
                </label>
                <label>
                    类型
                    <div class="filter-field form-select-field">
                        <select class="native-control" name="type" required data-native-select="categoryType" data-category-type>
                            <option value="1">收入</option>
                            <option value="2">支出</option>
                        </select>
                        <button class="glass-select" type="button" data-dropdown-trigger="categoryType">
                            <span data-dropdown-label="categoryType">收入</span>
                            <span class="chevron"></span>
                        </button>
                        <div class="glass-menu form-menu" data-dropdown-menu="categoryType">
                            <button type="button" data-value="1">收入</button>
                            <button type="button" data-value="2">支出</button>
                        </div>
                    </div>
                </label>
                <label>
                    图标标识
                    <input name="icon" placeholder="tag" data-category-icon>
                </label>
                <label>
                    排序
                    <input name="sortOrder" type="number" value="0" data-category-sort>
                </label>
                <div class="form-actions">
                    <button class="secondary" type="button" data-close-category-modal>取消</button>
                    <button type="submit">保存分类</button>
                </div>
            </form>
        </section>
    </div>

    <div class="modal-backdrop" data-delete-category-modal hidden>
        <section class="category-modal delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-category-title">
            <div class="modal-head">
                <div>
                    <h2 id="delete-category-title">删除分类</h2>
                    <p data-delete-category-summary>确认删除这个分类？</p>
                </div>
                <button class="icon-button" type="button" aria-label="关闭" data-close-delete-category-modal>×</button>
            </div>
            <div class="delete-warning">
                <strong>删除后无法恢复</strong>
                <span>如果该分类已经关联收支记录，系统会保留分类并提示无法删除。</span>
            </div>
            <div class="form-actions">
                <button class="secondary" type="button" data-close-delete-category-modal>取消</button>
                <button class="danger-button" type="button" data-confirm-delete-category>确认删除</button>
            </div>
        </section>
    </div>
</main>
<script th:src="@{/js/export-modal.js(v=1)}"></script>
<script th:src="@{/js/profile-password-modal.js(v=1)}"></script>
<script>
    (() => {
        const modal = document.querySelector('[data-category-modal]');
        const form = document.querySelector('[data-category-form]');
        const title = document.getElementById('category-modal-title');
        const fields = {
            id: document.querySelector('[data-category-id]'),
            name: document.querySelector('[data-category-name]'),
            type: document.querySelector('[data-category-type]'),
            icon: document.querySelector('[data-category-icon]'),
            sort: document.querySelector('[data-category-sort]')
        };
        const categoryRows = Array.from(document.querySelectorAll('[data-category-type]'));
        const categoryTabs = Array.from(document.querySelectorAll('[data-category-filter]'));
        const categoryTitle = document.querySelector('[data-category-title]');
        const categoryCount = document.querySelector('[data-category-count]');
        const categoryEmpty = document.querySelector('[data-category-empty]');
        const deleteModal = document.querySelector('[data-delete-category-modal]');
        const deleteSummary = document.querySelector('[data-delete-category-summary]');
        let pendingDeleteForm = null;

        const closeMenus = () => {
            document.querySelectorAll('.filter-field.is-open').forEach((field) => {
                field.classList.remove('is-open');
            });
        };

        document.querySelectorAll('[data-native-select]').forEach((select) => {
            const name = select.dataset.nativeSelect;
            const label = document.querySelector(`[data-dropdown-label="${name}"]`);
            const menu = document.querySelector(`[data-dropdown-menu="${name}"]`);
            const trigger = document.querySelector(`[data-dropdown-trigger="${name}"]`);
            const syncLabel = () => {
                label.textContent = select.selectedOptions[0]?.textContent?.trim() || '请选择';
                menu.querySelectorAll('button').forEach((button) => {
                    button.classList.toggle('is-selected', button.dataset.value === select.value);
                });
            };
            trigger.addEventListener('click', () => {
                const field = trigger.closest('.filter-field');
                const wasOpen = field.classList.contains('is-open');
                closeMenus();
                field.classList.toggle('is-open', !wasOpen);
            });
            menu.querySelectorAll('button').forEach((button) => {
                button.addEventListener('click', () => {
                    select.value = button.dataset.value;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    syncLabel();
                    closeMenus();
                });
            });
            select.addEventListener('change', syncLabel);
            syncLabel();
        });

        const renderCategoryType = (type) => {
            const label = type === '1' ? '收入' : '支出';
            let visibleCount = 0;
            categoryRows.forEach((row) => {
                const isVisible = row.dataset.categoryType === type;
                row.hidden = !isVisible;
                if (isVisible) {
                    visibleCount += 1;
                }
            });
            categoryTabs.forEach((button) => {
                button.classList.toggle('is-active', button.dataset.categoryFilter === type);
            });
            categoryTitle.textContent = `${label}分类`;
            categoryCount.textContent = `共 ${visibleCount} 个${label}分类`;
            categoryEmpty.hidden = visibleCount > 0;
            categoryEmpty.textContent = `暂无${label}分类，点击“新建分类”开始添加。`;
        };

        categoryTabs.forEach((button) => {
            button.addEventListener('click', () => renderCategoryType(button.dataset.categoryFilter));
        });

        const openModal = (category = {}) => {
            title.textContent = category.id ? '编辑分类' : '新建分类';
            fields.id.value = category.id || '';
            fields.name.value = category.name || '';
            fields.type.value = category.type || '1';
            fields.icon.value = category.icon || 'tag';
            fields.sort.value = category.sort || '0';
            fields.type.dispatchEvent(new Event('change', { bubbles: true }));
            modal.hidden = false;
            document.body.classList.add('modal-open');
            window.requestAnimationFrame(() => fields.name.focus());
        };

        const closeModal = () => {
            modal.hidden = true;
            form.reset();
            document.body.classList.remove('modal-open');
        };

        document.querySelector('[data-open-category-modal]').addEventListener('click', () => openModal());
        document.querySelectorAll('[data-edit-category]').forEach((button) => {
            button.addEventListener('click', () => openModal(button.dataset));
        });
        document.querySelectorAll('[data-close-category-modal]').forEach((button) => {
            button.addEventListener('click', closeModal);
        });
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });
        const closeDeleteModal = () => {
            deleteModal.hidden = true;
            pendingDeleteForm = null;
            document.body.classList.remove('modal-open');
        };
        const openDeleteModal = (formElement, trigger) => {
            pendingDeleteForm = formElement;
            const kind = trigger.dataset.categoryKind || '收支';
            const name = trigger.dataset.categoryName || '这个分类';
            deleteSummary.textContent = `确认删除“${name}”这个${kind}分类？`;
            deleteModal.hidden = false;
            document.body.classList.add('modal-open');
        };
        deleteModal.addEventListener('click', (event) => {
            if (event.target === deleteModal) {
                closeDeleteModal();
            }
        });
        document.querySelectorAll('[data-close-delete-category-modal]').forEach((button) => {
            button.addEventListener('click', closeDeleteModal);
        });
        document.querySelector('[data-confirm-delete-category]').addEventListener('click', () => {
            if (pendingDeleteForm) {
                pendingDeleteForm.submit();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !deleteModal.hidden) {
                closeMenus();
                closeDeleteModal();
            } else if (event.key === 'Escape' && !modal.hidden) {
                closeMenus();
                closeModal();
            }
        });
        document.querySelectorAll('[data-delete-category]').forEach((formElement) => {
            formElement.addEventListener('submit', (event) => {
                event.preventDefault();
                openDeleteModal(formElement, event.submitter || formElement.querySelector('button[type="submit"]'));
            });
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.filter-field')) {
                closeMenus();
            }
            if (!event.target.closest('[data-profile-menu]')) {
                profileMenu?.classList.remove('is-open');
            }
        });

        const profileMenu = document.querySelector('[data-profile-menu]');
        const profileTrigger = document.querySelector('[data-profile-trigger]');
        profileTrigger?.addEventListener('click', (event) => {
            event.stopPropagation();
            profileMenu.classList.toggle('is-open');
        });
        renderCategoryType('1');
    })();
</script>
</body>
</html>
