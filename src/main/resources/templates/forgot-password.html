<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>忘记密码 - 个人理财记账系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card">
        <div class="brand login-brand">
            <span class="brand-mark">¥</span>
            <span class="brand-copy">
                <strong>个人理财记账系统</strong>
            </span>
        </div>
        <div>
            <h1>重置密码</h1>
            <p>输入用户名并设置新的登录密码</p>
        </div>
        <div class="toast error" th:if="${error}" th:text="${error}">重置失败</div>
        <form class="login-form" th:action="@{/forgot-password}" method="post">
            <label>
                用户名
                <input name="username" autocomplete="username" th:value="${username}" required autofocus>
            </label>
            <label>
                新密码
                <input name="password" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <label>
                确认新密码
                <input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button type="submit">重置密码</button>
        </form>
        <p class="login-hint">想起密码？<a th:href="@{/login}">返回登录</a></p>
    </section>
</main>
</body>
</html>
