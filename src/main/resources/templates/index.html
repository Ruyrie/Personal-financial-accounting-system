<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>财务总览 - 个人理财记账系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">¥</span>
        <span class="brand-copy">
            <strong>个人理财记账系统</strong>
        </span>
    </a>
    <nav class="primary-nav" aria-label="主导航">
        <a th:href="@{/}" class="active">总览</a>
        <a th:href="@{/transactions}">收支记录</a>
        <a th:href="@{/transactions/new}">记一笔</a>
        <a th:href="@{/categories}">分类管理</a>
        <div class="profile-menu" data-profile-menu>
            <button class="avatar-trigger" type="button" data-profile-trigger aria-label="个人中心">
                <img th:if="${currentUser != null && currentUser.avatarData != null}" th:src="${currentUser.avatarData}" alt="">
                <span th:if="${currentUser == null || currentUser.avatarData == null}"
                      th:text="${currentUser != null ? #strings.substring(currentUser.username, 0, 1).toUpperCase() : '我'}">我</span>
            </button>
            <div class="profile-panel" data-profile-panel>
                <strong th:text="${currentUser != null ? currentUser.username : '个人中心'}">个人中心</strong>
                <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                    <label class="profile-upload">
                        设置头像
                        <input name="avatar" type="file" accept="image/png,image/jpeg,image/webp" onchange="this.form.submit()">
                    </label>
                </form>
                <a th:href="@{/transactions/export}">导出全部收支</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">退出登录</button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main class="container">
    <section class="page-head">
        <div>
            <h1>财务总览</h1>
            <p th:text="${month}">2026-06</p>
        </div>
        <form class="inline-form month-filter" th:action="@{/}" method="get" data-month-form>
            <div class="filter-field month-field">
                <input class="native-control" type="month" name="month" th:value="${month}" data-native-month>
                <button class="glass-select" type="button" data-month-trigger>
                    <span data-month-label>选择月份</span>
                    <span class="chevron">⌄</span>
                </button>
                <div class="glass-menu month-menu" data-month-menu>
                    <div class="month-head">
                        <button type="button" data-year-prev>‹</button>
                        <strong data-year-label>2026</strong>
                        <button type="button" data-year-next>›</button>
                    </div>
                    <div class="month-grid" data-month-grid></div>
                    <div class="month-actions">
                        <button type="button" data-month-clear>清除</button>
                        <button type="button" data-month-current>本月</button>
                    </div>
                </div>
            </div>
        </form>
    </section>

    <section class="stats-grid">
        <article class="stat-card income">
            <span>收入</span>
            <strong th:text="${'¥' + #numbers.formatDecimal(stats.income(), 1, 2)}">¥0.00</strong>
        </article>
        <article class="stat-card expense">
            <span>支出</span>
            <strong th:text="${'¥' + #numbers.formatDecimal(stats.expense(), 1, 2)}">¥0.00</strong>
        </article>
        <article class="stat-card balance">
            <span>结余</span>
            <strong th:text="${'¥' + #numbers.formatDecimal(stats.balance(), 1, 2)}">¥0.00</strong>
        </article>
    </section>

    <section class="dashboard-grid">
        <div class="transactions-panel">
            <div class="section-title">
                <h2>最近5笔交易</h2>
                <a th:href="@{/transactions}">查看全部</a>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(recentTransactions)}">暂无交易记录</div>
            <article class="transaction-item" th:each="item : ${recentTransactions}">
                <div>
                    <strong th:text="${item.categoryName}">餐饮</strong>
                    <p th:text="${item.remark ?: '无备注'}">午餐</p>
                </div>
                <div class="amount" th:classappend="${item.type == 1 ? 'income-text' : 'expense-text'}"
                     th:text="${(item.type == 1 ? '+' : '-') + '¥' + #numbers.formatDecimal(item.amount, 1, 2)}">
                    -¥0.00
                </div>
            </article>
        </div>

        <div class="chart-card">
            <div class="section-title">
                <h2>支出分类占比</h2>
                <span>饼图数据</span>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(categoryStats)}">暂无支出数据</div>
            <div class="pie-wrap redesigned-pie" th:if="${!#lists.isEmpty(categoryStats)}">
                <div class="chart-panel">
                    <canvas id="categoryChart" width="260" height="260" aria-label="支出分类占比图表"></canvas>
                    <div class="chart-center">
                        <span>支出</span>
                        <strong th:text="${'¥' + #numbers.formatDecimal(stats.expense(), 1, 2)}">¥0.00</strong>
                    </div>
                </div>
                <ul class="legend">
                    <li th:each="stat : ${categoryStats}">
                        <span th:text="${stat.categoryName()}">餐饮</span>
                        <strong th:text="${#numbers.formatDecimal(stat.percent(), 1, 2) + '%'}">0%</strong>
                    </li>
                </ul>
            </div>
        </div>
    </section>
</main>
<script th:src="@{/webjars/chart.js/4.4.7/dist/chart.umd.js}"></script>
<script th:inline="javascript">
    (() => {
        let financeCategoryChart;
        const labels = /*[[${categoryStats.![categoryName()]}]]*/ [];
        const amounts = /*[[${categoryStats.![amount()]}]]*/ [];
        const values = amounts.map(Number);
        const colors = ['#3f7ee8', '#29c76f', '#f6a21a', '#f46d56', '#8b5cf6', '#16b8c7'];

        const initCategoryChart = () => {
            const chart = document.getElementById('categoryChart');
            if (chart && window.Chart) {
                const existingChart = Chart.getChart(chart);
                if (financeCategoryChart) {
                    financeCategoryChart.destroy();
                }
                if (existingChart) {
                    existingChart.destroy();
                }
                financeCategoryChart = new Chart(chart, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            data: values,
                            backgroundColor: colors,
                            borderColor: 'rgba(255,255,255,0.96)',
                            borderRadius: 9,
                            borderWidth: 5,
                            hoverOffset: 12,
                            spacing: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            animateRotate: true,
                            duration: 700
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => `${context.label}: ¥${Number(context.raw).toFixed(2)}`
                                }
                            }
                        },
                        cutout: '62%'
                    }
                });
                window.financeChartReady = true;
            } else if (chart) {
                const total = values.reduce((sum, value) => sum + value, 0);
                const ctx = chart.getContext('2d');
                ctx.clearRect(0, 0, chart.width, chart.height);
                let start = -Math.PI / 2;
                values.forEach((value, index) => {
                    const angle = total === 0 ? 0 : (value / total) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(chart.width / 2, chart.height / 2);
                    ctx.arc(chart.width / 2, chart.height / 2, Math.min(chart.width, chart.height) / 2 - 10, start, start + angle);
                    ctx.closePath();
                    ctx.fillStyle = colors[index % colors.length];
                    ctx.fill();
                    start += angle;
                });
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(chart.width / 2, chart.height / 2, Math.min(chart.width, chart.height) * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                window.financeChartReady = labels.length > 0;
            }
        };
        initCategoryChart();
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initCategoryChart();
            }
        });

        const closeMenus = () => {
            document.querySelectorAll('.filter-field.is-open').forEach((field) => {
                field.classList.remove('is-open');
            });
        };
        const monthForm = document.querySelector('[data-month-form]');
        const nativeMonth = document.querySelector('[data-native-month]');
        const monthLabel = document.querySelector('[data-month-label]');
        const monthGrid = document.querySelector('[data-month-grid]');
        const yearLabel = document.querySelector('[data-year-label]');
        const monthTrigger = document.querySelector('[data-month-trigger]');
        const now = new Date();
        let visibleYear = nativeMonth.value ? Number(nativeMonth.value.slice(0, 4)) : now.getFullYear();

        const monthText = (value) => {
            if (!value) {
                return '选择月份';
            }
            const [year, month] = value.split('-');
            return `${year}年${month}月`;
        };

        const renderMonths = () => {
            yearLabel.textContent = visibleYear;
            monthLabel.textContent = monthText(nativeMonth.value);
            monthGrid.innerHTML = '';
            Array.from({ length: 12 }, (_, index) => {
                const month = String(index + 1).padStart(2, '0');
                const value = `${visibleYear}-${month}`;
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = `${index + 1}月`;
                button.classList.toggle('is-selected', nativeMonth.value === value);
                button.addEventListener('click', () => {
                    nativeMonth.value = value;
                    renderMonths();
                    closeMenus();
                    monthForm.submit();
                });
                monthGrid.appendChild(button);
            });
        };

        monthTrigger.addEventListener('click', () => {
            const field = monthTrigger.closest('.filter-field');
            const wasOpen = field.classList.contains('is-open');
            closeMenus();
            field.classList.toggle('is-open', !wasOpen);
        });
        document.querySelector('[data-year-prev]').addEventListener('click', () => {
            visibleYear -= 1;
            renderMonths();
        });
        document.querySelector('[data-year-next]').addEventListener('click', () => {
            visibleYear += 1;
            renderMonths();
        });
        document.querySelector('[data-month-clear]').addEventListener('click', () => {
            nativeMonth.value = '';
            renderMonths();
            closeMenus();
            monthForm.submit();
        });
        document.querySelector('[data-month-current]').addEventListener('click', () => {
            visibleYear = now.getFullYear();
            nativeMonth.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            renderMonths();
            closeMenus();
            monthForm.submit();
        });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('.filter-field')) {
                closeMenus();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeMenus();
            }
        });
        renderMonths();

        const profileMenu = document.querySelector('[data-profile-menu]');
        const profileTrigger = document.querySelector('[data-profile-trigger]');
        profileTrigger?.addEventListener('click', (event) => {
            event.stopPropagation();
            profileMenu.classList.toggle('is-open');
        });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('[data-profile-menu]')) {
                profileMenu?.classList.remove('is-open');
            }
        });
    })();
</script>
</body>
</html>
