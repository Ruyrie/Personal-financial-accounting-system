<!doctype html>
<!-- 登录页面：提交用户名、密码和记住我选项到 Spring Security 登录流程。 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 个人理财记账系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card">
        <div class="brand login-brand">
            <span class="brand-mark">¥</span>
            <span class="brand-copy">
                <strong>个人理财记账系统</strong>
            </span>
        </div>
        <div>
            <h1>账户登录</h1>
            <p>请输入账号密码后继续管理收支记录</p>
        </div>
        <div class="toast" th:if="${message}" th:text="${message}">注册成功</div>
        <div class="toast error" th:if="${param.error}">账号或密码不正确</div>
        <div class="toast" th:if="${param.logout}">已安全退出</div>
        <div class="toast" th:if="${param.passwordChanged}">密码已修改，请重新登录</div>
        <form class="login-form" th:action="@{/login}" method="post">
            <label>
                用户名
                <input name="username" autocomplete="username" required
                       th:value="${username}" th:readonly="${username != null}" th:autofocus="${username == null}">
            </label>
            <label>
                密码
                <input name="password" type="password" autocomplete="current-password" required th:autofocus="${username != null}">
            </label>
            <label class="remember-row">
                <input name="remember-me" type="checkbox" value="true">
                <span>记住密码，下次自动登录</span>
            </label>
            <button type="submit">登录系统</button>
        </form>
        <p class="login-hint">
            <span>没有账号？<a th:href="@{/register}">立即注册</a></span>
            <a th:href="@{/forgot-password}">忘记密码</a>
        </p>
    </section>
</main>
</body>
</html>
