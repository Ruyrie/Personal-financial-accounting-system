<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>密码已修改 - 个人理财记账系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card password-changed-card">
        <div class="brand login-brand">
            <span class="brand-mark">¥</span>
            <span class="brand-copy">
                <strong>个人理财记账系统</strong>
            </span>
        </div>
        <div>
            <h1>密码已修改</h1>
            <p>为了保护账户安全，请重新登录。</p>
        </div>
        <a class="button password-confirm-button" th:href="@{/login(passwordChanged=true)}">确定</a>
    </section>
</main>
</body>
</html>
