<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create' ? '新增记录' : '编辑记录'}">记一笔</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
</head>
<body th:data-transaction-type="${transaction.type ?: 2}">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">¥</span>
        <span class="brand-copy">
            <strong>个人理财记账系统</strong>
        </span>
    </a>
    <nav class="primary-nav" aria-label="主导航">
        <a th:href="@{/}">总览</a>
        <a th:href="@{/transactions}" th:classappend="${mode == 'edit'} ? 'active'">收支记录</a>
        <a th:href="@{/transactions/new}" th:classappend="${mode == 'create'} ? 'active'">记一笔</a>
        <a th:href="@{/categories}">分类管理</a>
        <div class="profile-menu" data-profile-menu>
            <button class="avatar-trigger" type="button" data-profile-trigger aria-label="个人中心">
                <img th:if="${currentUser != null && currentUser.avatarData != null}" th:src="${currentUser.avatarData}" alt="头像">
                <img th:if="${currentUser == null || currentUser.avatarData == null}" th:src="@{/images/morentouxiang.png}" alt="默认头像">
            </button>
            <div class="profile-panel" data-profile-panel>
                <div class="profile-id">
                    <span class="profile-id-avatar">
                        <img th:if="${currentUser != null && currentUser.avatarData != null}" th:src="${currentUser.avatarData}" alt="头像">
                        <img th:if="${currentUser == null || currentUser.avatarData == null}" th:src="@{/images/morentouxiang.png}" alt="默认头像">
                    </span>
                    <div class="profile-id-meta">
                        <strong th:text="${currentUser != null ? currentUser.username : '个人中心'}"
                                th:title="${currentUser != null ? currentUser.username : '个人中心'}">个人中心</strong>
                    </div>
                </div>
                <form class="profile-action-form" th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                    <label class="profile-action profile-upload">
                        <span class="profile-action-icon" aria-hidden="true">⟳</span>
                        <span class="profile-action-text">更换头像</span>
                        <input name="avatar" type="file" accept="image/png,image/jpeg,image/webp" onchange="this.form.submit()">
                    </label>
                </form>
                <button class="profile-action" type="button" data-open-password-modal>
                    <span class="profile-action-icon" aria-hidden="true">✎</span>
                    <span class="profile-action-text">修改密码</span>
                </button>
                <a class="profile-action" th:href="@{/transactions/export}" th:data-export-base="@{/transactions/export}" data-export-trigger>
                    <span class="profile-action-icon" aria-hidden="true">↧</span>
                    <span class="profile-action-text">导出excel数据</span>
                </a>
                <form class="profile-action-form" th:action="@{/logout}" method="post">
                    <button class="profile-action profile-action-danger" type="submit">
                        <span class="profile-action-icon" aria-hidden="true">⏻</span>
                        <span class="profile-action-text">退出登录</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main class="container record-page">
    <div class="toast" th:if="${message}" th:text="${message}">操作成功</div>
    <div class="toast error" th:if="${error}" th:text="${error}">操作失败</div>

    <section class="page-head">
        <div>
            <h1 th:text="${mode == 'create' ? '新增收支记录' : '编辑收支记录'}">新增收支记录</h1>
            <p>填写金额、分类、日期和备注</p>
        </div>
        <div class="head-actions">
            <a class="button secondary" th:href="@{/transactions/export}" th:data-export-base="@{/transactions/export}" data-export-trigger>导出Excel</a>
        </div>
    </section>

    <div class="record-layout">
    <form class="form-panel" method="post"
          th:action="${mode == 'create' ? '/transactions' : '/transactions/' + transaction.id}"
          th:object="${transaction}">
        <label>
            类型
            <div class="filter-field form-select-field">
                <select class="native-control" th:field="*{type}" required data-native-select="transactionType">
                    <option value="1">收入</option>
                    <option value="2">支出</option>
                </select>
                <button class="glass-select" type="button" data-dropdown-trigger="transactionType">
                    <span data-dropdown-label="transactionType">支出</span>
                    <span class="chevron">⌄</span>
                </button>
                <div class="glass-menu form-menu" data-dropdown-menu="transactionType">
                    <button type="button" data-value="1">收入</button>
                    <button type="button" data-value="2">支出</button>
                </div>
            </div>
        </label>
        <label>
            分类
            <div class="filter-field form-select-field">
                <select class="native-control" th:field="*{categoryId}" required data-native-select="categoryId">
                    <option value="">请选择分类</option>
                    <option th:each="category : ${categories}" th:value="${category.id}"
                            th:data-category-type="${category.type}"
                            th:text="${category.type == 1 ? '收入 - ' + category.name : '支出 - ' + category.name}">
                        分类
                    </option>
                </select>
                <button class="glass-select" type="button" data-dropdown-trigger="categoryId">
                    <span data-dropdown-label="categoryId">请选择分类</span>
                    <span class="chevron">⌄</span>
                </button>
                <div class="glass-menu form-menu" data-dropdown-menu="categoryId">
                    <button type="button" data-value="">请选择分类</button>
                    <button th:each="category : ${categories}" type="button" th:data-value="${category.id}"
                            th:data-category-type="${category.type}"
                            th:text="${category.type == 1 ? '收入 - ' + category.name : '支出 - ' + category.name}">
                        分类
                    </button>
                </div>
            </div>
        </label>
        <label>
            金额
            <input th:field="*{amount}" type="number" min="0.01" step="0.01" required>
        </label>
        <label>
            日期
            <div class="filter-field date-field" data-date-picker="recordDate">
                <input class="native-control" th:field="*{recordDate}" type="date" required data-native-date="recordDate">
                <button class="glass-select" type="button" data-date-trigger="recordDate">
                    <span data-date-label="recordDate">选择日期</span>
                    <span class="date-icon"></span>
                </button>
                <div class="glass-menu date-menu" data-date-menu="recordDate">
                    <div class="month-head">
                        <button type="button" data-date-prev="recordDate">‹</button>
                        <strong data-date-title="recordDate">2026年06月</strong>
                        <button type="button" data-date-next="recordDate">›</button>
                    </div>
                    <div class="date-weekdays">
                        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                    </div>
                    <div class="date-grid" data-date-grid="recordDate"></div>
                    <div class="month-actions">
                        <button type="button" data-date-today="recordDate">今天</button>
                    </div>
                </div>
            </div>
        </label>
        <label>
            备注
            <textarea th:field="*{remark}" maxlength="200" rows="4" placeholder="例如：午餐外卖"></textarea>
        </label>
        <div class="form-actions">
            <button type="submit">保存</button>
            <a class="button secondary" th:href="@{/transactions}">返回</a>
        </div>
    </form>

    <aside class="record-aside">
        <div class="record-preview-card">
            <span class="record-preview-label">实时预览</span>
            <div class="record-preview-amount" data-preview-amount>¥0.00</div>
            <div class="record-preview-meta">
                <div><span>类型</span><strong data-preview-type>支出</strong></div>
                <div><span>分类</span><strong data-preview-category>未选择</strong></div>
                <div><span>日期</span><strong data-preview-date>未选择</strong></div>
            </div>
            <p class="record-preview-remark" data-preview-remark>暂无备注</p>
        </div>
        <ul class="record-tips">
            <li>金额支持两位小数，例如 28.50。</li>
            <li>请先在“分类管理”中维护好对应的收入 / 支出分类。</li>
            <li>备注最多 200 字，方便日后筛选与回顾。</li>
        </ul>
    </aside>
    </div>
</main>
<script th:src="@{/js/export-modal.js(v=1)}"></script>
<script th:src="@{/js/profile-password-modal.js(v=1)}"></script>
<script>
    (() => {
        const closeMenus = () => {
            document.querySelectorAll('.filter-field.is-open').forEach((field) => {
                field.classList.remove('is-open');
            });
        };

        const formatDateText = (value) => {
            if (!value) {
                return '选择日期';
            }
            const [year, month, day] = value.split('-');
            return `${year}/${month}/${day}`;
        };

        const initDatePicker = (name) => {
            const input = document.querySelector(`[data-native-date="${name}"]`);
            const trigger = document.querySelector(`[data-date-trigger="${name}"]`);
            const label = document.querySelector(`[data-date-label="${name}"]`);
            const title = document.querySelector(`[data-date-title="${name}"]`);
            const grid = document.querySelector(`[data-date-grid="${name}"]`);
            const menu = document.querySelector(`[data-date-menu="${name}"]`);
            const field = trigger.closest('.filter-field');
            const now = new Date();
            const selected = input.value ? new Date(`${input.value}T00:00:00`) : now;
            let visibleYear = selected.getFullYear();
            let visibleMonth = selected.getMonth();

            const backdrop = document.createElement('div');
            backdrop.className = 'date-modal-backdrop';
            backdrop.hidden = true;
            document.body.appendChild(backdrop);

            const openPicker = () => {
                closeMenus();
                backdrop.appendChild(menu);
                backdrop.hidden = false;
                document.body.classList.add('modal-open');
                render();
            };
            const closePicker = () => {
                if (backdrop.hidden) {
                    return;
                }
                backdrop.hidden = true;
                field.appendChild(menu);
                document.body.classList.remove('modal-open');
            };

            const render = () => {
                label.textContent = formatDateText(input.value);
                title.textContent = `${visibleYear}年${String(visibleMonth + 1).padStart(2, '0')}月`;
                grid.innerHTML = '';
                const first = new Date(visibleYear, visibleMonth, 1);
                const startOffset = (first.getDay() + 6) % 7;
                const start = new Date(visibleYear, visibleMonth, 1 - startOffset);
                Array.from({ length: 42 }, (_, index) => {
                    const day = new Date(start);
                    day.setDate(start.getDate() + index);
                    const value = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = day.getDate();
                    button.classList.toggle('is-muted', day.getMonth() !== visibleMonth);
                    button.classList.toggle('is-selected', input.value === value);
                    button.addEventListener('click', () => {
                        input.value = value;
                        input.dispatchEvent(new Event('change', { bubbles: true }));
                        render();
                        closePicker();
                    });
                    grid.appendChild(button);
                });
            };

            trigger.addEventListener('click', (event) => {
                event.stopPropagation();
                if (backdrop.hidden) {
                    openPicker();
                } else {
                    closePicker();
                }
            });
            backdrop.addEventListener('click', (event) => {
                if (event.target === backdrop) {
                    closePicker();
                }
            });
            document.querySelector(`[data-date-prev="${name}"]`).addEventListener('click', () => {
                visibleMonth -= 1;
                if (visibleMonth < 0) {
                    visibleMonth = 11;
                    visibleYear -= 1;
                }
                render();
            });
            document.querySelector(`[data-date-next="${name}"]`).addEventListener('click', () => {
                visibleMonth += 1;
                if (visibleMonth > 11) {
                    visibleMonth = 0;
                    visibleYear += 1;
                }
                render();
            });
            document.querySelector(`[data-date-today="${name}"]`).addEventListener('click', () => {
                input.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                visibleYear = now.getFullYear();
                visibleMonth = now.getMonth();
                render();
                closePicker();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closePicker();
                }
            });
            render();
        };

        document.querySelectorAll('[data-native-select]').forEach((select) => {
            const name = select.dataset.nativeSelect;
            const label = document.querySelector(`[data-dropdown-label="${name}"]`);
            const menu = document.querySelector(`[data-dropdown-menu="${name}"]`);
            const trigger = document.querySelector(`[data-dropdown-trigger="${name}"]`);
            const syncLabel = () => {
                label.textContent = select.selectedOptions[0]?.textContent?.trim() || '请选择';
                menu.querySelectorAll('button').forEach((button) => {
                    button.classList.toggle('is-selected', button.dataset.value === select.value);
                });
            };

            trigger.addEventListener('click', () => {
                const field = trigger.closest('.filter-field');
                const wasOpen = field.classList.contains('is-open');
                closeMenus();
                field.classList.toggle('is-open', !wasOpen);
            });

            menu.querySelectorAll('button').forEach((button) => {
                button.addEventListener('click', () => {
                    select.value = button.dataset.value;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    syncLabel();
                    closeMenus();
                });
            });

            syncLabel();
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.filter-field')) {
                closeMenus();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeMenus();
            }
        });
        initDatePicker('recordDate');

        const previewAmount = document.querySelector('[data-preview-amount]');
        const previewType = document.querySelector('[data-preview-type]');
        const previewCategory = document.querySelector('[data-preview-category]');
        const previewDate = document.querySelector('[data-preview-date]');
        const previewRemark = document.querySelector('[data-preview-remark]');
        const typeSelect = document.querySelector('[data-native-select="transactionType"]');
        const categorySelect = document.querySelector('[data-native-select="categoryId"]');
        const categoryMenu = document.querySelector('[data-dropdown-menu="categoryId"]');
        const amountInput = document.querySelector('input[name="amount"]');
        const dateInput = document.querySelector('[data-native-date="recordDate"]');
        const remarkInput = document.querySelector('textarea[name="remark"]');
        const formatCurrency = (value) => `¥${Number(value || 0).toLocaleString('zh-CN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        })}`;

        const updateCategoryOptions = () => {
            if (!typeSelect || !categorySelect || !categoryMenu) {
                return;
            }
            const type = typeSelect.value || '2';
            document.body.dataset.transactionType = type;
            let selectedStillVisible = !categorySelect.value;
            Array.from(categorySelect.options).forEach((option) => {
                const optionType = option.dataset.categoryType;
                const visible = !optionType || optionType === type;
                option.hidden = !visible;
                option.disabled = !visible;
                if (option.value === categorySelect.value && visible) {
                    selectedStillVisible = true;
                }
            });
            categoryMenu.querySelectorAll('button').forEach((button) => {
                const buttonType = button.dataset.categoryType;
                const visible = !buttonType || buttonType === type;
                button.hidden = !visible;
                button.classList.toggle('is-filtered-out', !visible);
                button.style.display = visible ? '' : 'none';
            });
            if (!selectedStillVisible) {
                categorySelect.value = '';
                categorySelect.dispatchEvent(new Event('change', { bubbles: true }));
            }
        };

        const updatePreview = () => {
            if (!previewAmount) {
                return;
            }
            const isIncome = typeSelect && typeSelect.value === '1';
            const amount = Number(amountInput && amountInput.value) || 0;
            const sign = amount === 0 ? '' : (isIncome ? '+' : '-');
            previewAmount.textContent = `${sign}${formatCurrency(amount)}`;
            previewAmount.classList.toggle('is-income', isIncome);
            previewType.textContent = isIncome ? '收入' : '支出';
            const categoryText = categorySelect && categorySelect.selectedOptions[0]
                ? categorySelect.selectedOptions[0].textContent.trim() : '';
            previewCategory.textContent = categoryText && categorySelect.value ? categoryText : '未选择';
            previewDate.textContent = dateInput && dateInput.value ? formatDateText(dateInput.value) : '未选择';
            const remarkText = remarkInput && remarkInput.value.trim();
            previewRemark.textContent = remarkText || '暂无备注';
        };

        typeSelect?.addEventListener('change', () => {
            updateCategoryOptions();
            updatePreview();
        });
        document.querySelector('[data-dropdown-trigger="categoryId"]')
            ?.addEventListener('click', updateCategoryOptions, true);
        [categorySelect, dateInput].forEach((el) => {
            el?.addEventListener('change', updatePreview);
        });
        [amountInput, remarkInput].forEach((el) => {
            el?.addEventListener('input', updatePreview);
        });
        updateCategoryOptions();
        updatePreview();

        const profileMenu = document.querySelector('[data-profile-menu]');
        const profileTrigger = document.querySelector('[data-profile-trigger]');
        profileTrigger?.addEventListener('click', (event) => {
            event.stopPropagation();
            profileMenu.classList.toggle('is-open');
        });
        document.addEventListener('click', (event) => {
            if (!event.target.closest('[data-profile-menu]')) {
                profileMenu?.classList.remove('is-open');
            }
        });
    })();
</script>
</body>
</html>
